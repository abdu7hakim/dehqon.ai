<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehqon AI - Tizimga Kirish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-wrapper">
                    <!-- Tractor SVG -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="17.5" cy="16.5" r="4.5" />
                        <circle cx="17.5" cy="16.5" r="1.5" />
                        <circle cx="6" cy="18" r="3" />
                        <circle cx="6" cy="18" r="1" />
                        <path d="M6 15h7.5V9.5H9.5V11H6Z" />
                        <path d="M13.5 15H17.5V7.5H12v3.5" />
                        <path d="M12 11h5.5" />
                        <path d="M8.5 9.5V5.5h1" />
                    </svg>
                </div>
                <div>
                    <h1 class="auth-title">Xush kelibsiz!</h1>
                    <p class="auth-subtitle">Tizimga kirish uchun ma'lumotlaringizni kiriting.</p>
                </div>
            </div>

            <form id="signin-form" class="form-group" novalidate>
                <!-- Phone -->
                <div class="input-wrapper">
                    <input type="tel" id="phone" class="form-input" placeholder="Telefon raqam" value="+998" required>
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                        </svg>
                    </span>
                </div>

                <!-- Password -->
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="Parol" required>
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </span>
                    <button type="button" class="password-toggle" id="password-toggle-btn">
                        <!-- Eye Icon -->
                        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>

                <div class="form-link-wrapper">
                    <a href="#" class="forgot-link" id="forgot-password-link">Parolni unutdingizmi?</a>
                </div>

                <!-- Role Selector -->
                <div>
                    <h3 class="role-section-title">Rolingizni tanlang</h3>
                    <div class="role-grid">
                        <!-- Farmer -->
                        <div class="role-card selected" data-role="fermer">
                            <div class="role-icon-wrapper">
                                <!-- Leaf SVG -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 8a8.5 8.5 0 0 1-9 10Z" />
                                    <path d="M9 22v-4" />
                                </svg>
                            </div>
                            <span class="role-name">Fermer</span>
                            <div class="role-badge">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg>
                            </div>
                        </div>

                        <!-- Seller -->
                        <div class="role-card" data-role="sotuvchi">
                            <div class="role-icon-wrapper">
                                <!-- Store/Shop SVG -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                    <polyline points="9 22 9 12 15 12 15 22" />
                                </svg>
                            </div>
                            <span class="role-name">Sotuvchi</span>
                            <div class="role-badge">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg>
                            </div>
                        </div>

                        <!-- Buyer -->
                        <div class="role-card" data-role="haridor">
                            <div class="role-icon-wrapper">
                                <!-- Truck SVG -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="1" y="3" width="15" height="13" rx="2" ry="2" />
                                    <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
                                    <circle cx="5.5" cy="18.5" r="2.5" />
                                    <circle cx="18.5" cy="18.5" r="2.5" />
                                </svg>
                            </div>
                            <span class="role-name">Haridor</span>
                            <div class="role-badge">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg>
                            </div>
                        </div>

                        <!-- Admin -->
                        <div class="role-card" data-role="admin">
                            <div class="role-icon-wrapper">
                                <!-- Shield SVG -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                                </svg>
                            </div>
                            <span class="role-name">Admin</span>
                            <div class="role-badge">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" style="margin-top: 12px;">
                    <span>Tizimga kirish</span>
                </button>
            </form>

            <div class="auth-footer">
                <span>Hisobingiz yo'qmi? </span>
                <a href="signup.html">Ro'yxatdan o'ting</a>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <script src="auth.js"></script>
</body>
</html>
